name: Tests

# Plain Meson build through the Makefile plus the end-to-end suite in
# tests/run-tests.sh, the same way a developer runs it locally. The package
# workflow runs the suite as well, inside dpkg-buildpackage, but this job
# gives the quick answer and covers the non-packaged build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build pkg-config libzstd-dev liburing-dev >/dev/null

      - name: Build
        run: make config && make

      - name: Test
        run: make test

      - name: Show the test log on failure
        if: failure()
        run: cat build/meson-logs/testlog.txt
